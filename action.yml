name: 'RepoForge AI'
description: 'Generate technical docs and AI agent skills (SKILL.md, AGENT.md) from any codebase.'

branding:
  icon: 'book-open'
  color: 'purple'

inputs:
  command:
    description: >-
      Command to run: "docs" (generate documentation) or "skills" (generate
      SKILL.md + AGENT.md for Claude Code / OpenCode).
    required: false
    default: 'docs'

  language:
    description: >-
      Language for generated documentation.
      Options: English, Spanish, French, German, Portuguese,
      Chinese, Japanese, Korean, Russian, Italian, Dutch.
    required: false
    default: 'English'

  output-dir:
    description: >-
      Output directory. For "docs": defaults to "docs" (GitHub Pages ready).
      For "skills": defaults to ".claude".
    required: false
    default: ''

  working-dir:
    description: >-
      Path to the repository to analyze. Defaults to the root of the
      checked-out repository.
    required: false
    default: '.'

  model:
    description: >-
      LLM model to use. Defaults to "groq/openai/gpt-oss-120b", which needs
      the api-key input (GROQ_API_KEY). Other options:
        claude-haiku-3-5         — requires ANTHROPIC_API_KEY
        gpt-4o-mini              — requires OPENAI_API_KEY
        groq/llama-3.3-70b-versatile — requires GROQ_API_KEY
        nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b — requires NVIDIA_NIM_API_KEY
          and no-thinking: true. With thinking on, the draft is not markdown.
      github/* models do not run. GitHub Models was retired on 2026-07-30.
    required: false
    default: 'groq/openai/gpt-oss-120b'

  project-name:
    description: >-
      Override the project name (auto-detected from package.json /
      pyproject.toml by default).
    required: false
    default: ''

  theme:
    description: >-
      Docsify theme for "docs" command.
      Options: vue (default), dark, buble, pure.
    required: false
    default: 'vue'

  api-key:
    description: >-
      LLM provider API key. Required for the default Groq model.
      The same value is exported as GROQ_API_KEY, ANTHROPIC_API_KEY,
      OPENAI_API_KEY, NVIDIA_NIM_API_KEY, and NVIDIA_API_KEY.
      Pass the key that matches the selected model.
    required: false
    default: ''

  github-token:
    description: >-
      Passed through as GITHUB_TOKEN. GitHub Models was retired on 2026-07-30,
      so a github/* model will not generate. Leave this input alone unless you
      have a reason to override the token the runner already provides.
    required: false
    default: ${{ github.token }}

  no-thinking:
    description: >-
      Pass --no-thinking. Required for Nemotron on NVIDIA NIM, which otherwise
      prefixes a thinking trace and the skill draft is rejected.
    required: false
    default: 'false'

  python-version:
    description: >-
      Python version to use. Minimum: 3.10.
    required: false
    default: '3.11'

outputs:
  output-dir:
    description: 'Absolute path to the generated output directory'
    value: ${{ steps.run.outputs.output-dir }}

  project-name:
    description: 'Auto-detected or overridden project name'
    value: ${{ steps.run.outputs.project-name }}

  files-generated:
    description: 'Number of files generated'
    value: ${{ steps.run.outputs.files-generated }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: repoforge-pip-${{ inputs.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
        restore-keys: |
          repoforge-pip-${{ inputs.python-version }}-
          repoforge-pip-

    - name: Install repoforge
      shell: bash
      # Install the git ref this action was invoked with.
      # pip install repoforge is a different project (ahearn15).
      # This package is repoforge-ai on PyPI. Staying on the git ref keeps
      # uses: JNZader/repoforge@vX.Y.Z aligned with that tag, not with
      # whatever is newest on PyPI.
      run: |
        REF="${GITHUB_ACTION_REF:-main}"
        pip install "git+https://github.com/JNZader/repoforge.git@${REF}" --quiet

    - name: Install ripgrep (faster scanning)
      shell: bash
      run: |
        if ! command -v rg &> /dev/null; then
          sudo apt-get install -y ripgrep 2>/dev/null || true
        fi

    - name: Resolve output directory
      id: resolve
      shell: bash
      run: |
        CMD="${{ inputs.command }}"
        OUT="${{ inputs.output-dir }}"
        if [ -z "$OUT" ]; then
          if [ "$CMD" = "skills" ]; then
            OUT=".claude"
          else
            OUT="docs"
          fi
        fi
        echo "output-dir=$OUT" >> $GITHUB_OUTPUT

    - name: Run repoforge
      id: run
      shell: bash
      working-directory: ${{ inputs.working-dir }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
        OPENAI_API_KEY: ${{ inputs.api-key }}
        GROQ_API_KEY: ${{ inputs.api-key }}
        NVIDIA_NIM_API_KEY: ${{ inputs.api-key }}
        NVIDIA_API_KEY: ${{ inputs.api-key }}
      run: |
        CMD="${{ inputs.command }}"
        MODEL="${{ inputs.model }}"
        LANG="${{ inputs.language }}"
        OUT="${{ steps.resolve.outputs.output-dir }}"
        NAME="${{ inputs.project-name }}"
        THEME="${{ inputs.theme }}"

        # Build command args (no --quiet so errors are visible in Actions log).
        # The API key stays in the environment. Do not append it here:
        # this step prints ARGS.
        ARGS="$CMD --model $MODEL -o $OUT"
        if [ "${{ inputs.no-thinking }}" = "true" ]; then
          ARGS="$ARGS --no-thinking"
        fi

        if [ "$CMD" = "docs" ]; then
          ARGS="$ARGS --lang $LANG --theme $THEME"
          if [ -n "$NAME" ]; then
            ARGS="$ARGS --name \"$NAME\""
          fi
        fi

        echo "🚀 Running: repoforge $ARGS"
        repoforge $ARGS

        # Fail if nothing was generated (catches silent LLM errors)
        FILES=$(find $OUT -type f | wc -l | tr -d ' ')
        echo "files-generated=$FILES" >> $GITHUB_OUTPUT
        if [ "$FILES" -lt 3 ]; then
          echo "::error::repoforge generated only $FILES files — expected at least 3. Check LLM credentials."
          exit 1
        fi

        # Outputs
        echo "output-dir=$(realpath $OUT)" >> $GITHUB_OUTPUT
        echo "project-name=${NAME:-$(basename $(pwd))}" >> $GITHUB_OUTPUT

    - name: Summary
      shell: bash
      run: |
        CMD="${{ inputs.command }}"
        OUT="${{ steps.resolve.outputs.output-dir }}"
        FILES="${{ steps.run.outputs.files-generated }}"
        echo "## ⚒ RepoForge" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Command:** \`$CMD\`  " >> $GITHUB_STEP_SUMMARY
        echo "**Model:** \`${{ inputs.model }}\`  " >> $GITHUB_STEP_SUMMARY
        echo "**Output:** \`$OUT/\` ($FILES files)" >> $GITHUB_STEP_SUMMARY
        if [ "$CMD" = "docs" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📖 Documentation generated and ready for GitHub Pages." >> $GITHUB_STEP_SUMMARY
        else
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚒ Skills and agents generated for Claude Code / OpenCode." >> $GITHUB_STEP_SUMMARY
        fi
