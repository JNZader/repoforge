# ============================================================
# RepoForge — CI Pipeline
# ============================================================
# Runs tests on every push and PR to main.
# Jobs: core lib tests, server tests, frontend typecheck+build.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'repoforge/**'
      - 'apps/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [main]
    paths:
      - 'repoforge/**'
      - 'apps/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Core Library Tests (lean: no optional intelligence deps) ──
  # Pre-collection partition (S1): intelligence tests are excluded via --ignore
  # flags so the core job installs only `.[dev]` and never needs tree-sitter.
  test-core:
    name: Tests — Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run core tests (intelligence excluded pre-collection)
        # Ignores are DERIVED from tests/intelligence_tests.txt (single source of
        # truth) so the core job can never drift from the manifest. The parser
        # strips inline '# TRANSITIVE:' annotations before emitting --ignore args.
        run: |
          ignores=()
          while read -r line; do
            line="${line%%#*}"                                   # strip comments / TRANSITIVE annotations
            line="${line#"${line%%[![:space:]]*}"}"              # strip leading whitespace
            line="${line%"${line##*[![:space:]]}"}"              # strip trailing whitespace
            [ -n "$line" ] && ignores+=("--ignore=${line}")
          done < tests/intelligence_tests.txt
          [ "${#ignores[@]}" -gt 0 ] || { echo "intelligence manifest produced no ignore paths"; exit 1; }
          pytest tests/ "${ignores[@]}" -q --tb=short

  # ── Intelligence Tests (requires the `.[intelligence]` extra / tree-sitter) ──
  # Runs ONLY the explicit manifest paths (tests/intelligence_tests.txt) so the
  # heavy tree-sitter-dependent suite never drags down the lean core job. An
  # install failure here is fatal (hard-red): pip must succeed or the job fails.
  test-intelligence:
    name: Tests — Intelligence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,intelligence]"

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Run intelligence tests (explicit manifest paths)
        run: |
          paths=()
          while read -r line; do
            line="${line%%#*}"                                   # strip comments / TRANSITIVE annotations
            line="${line#"${line%%[![:space:]]*}"}"              # strip leading whitespace
            line="${line%"${line##*[![:space:]]}"}"              # strip trailing whitespace
            [ -n "$line" ] && paths+=("$line")                   # skip blank/whitespace-only lines
          done < tests/intelligence_tests.txt
          [ "${#paths[@]}" -gt 0 ] || { echo "intelligence manifest produced no test paths"; exit 1; }
          pytest "${paths[@]}" -q --tb=short

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.15.6

      - name: Lint with ruff
        run: ruff check repoforge/

  # ── Server Tests ──────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'server')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repoforge
          POSTGRES_PASSWORD: repoforge
          POSTGRES_DB: repoforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repoforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install core library
        run: pip install -e .

      - name: Install server dependencies
        run: pip install -r apps/server/requirements.txt

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx

      - name: Run server tests
        run: pytest apps/server/tests/ -v --tb=short
        env:
          DATABASE_URL: "postgresql+asyncpg://repoforge:repoforge@localhost:5432/repoforge_test"
          JWT_SECRET: "test-jwt-secret-ci-only"
          GITHUB_CLIENT_ID: "test-client-id"
          GITHUB_CLIENT_SECRET: "test-client-secret"
          STATE_SECRET: "test-state-secret"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          DEBUG: "true"

  # ── Frontend Typecheck & Build ────────────────────────────
  check-frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'frontend')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Build
        run: npm run build
        working-directory: apps/web
